<!DOCTYPE html>
<!--
  Market: a weeknight finance show. Three hosts on camera, live charts and graphs, and a stock
  ticker running along the bottom of every beat. For market recaps, earnings breakdowns and money explainers.
  Trading-floor charcoal (or paper grey), IBM Plex Sans Condensed headlines, Plex Mono tabular figures
  for every number, a gold accent, green/red for up/down (always with ▲/▼ and a sign, never colour alone).
  Motion is newsroom-steady: lines draw left to right and end on a dot, bars grow from the zero line,
  candles print one by one, big numbers count up to the close, the gold ON AIR border moves between
  cameras, and beats hard-cut like a live switcher. The ticker scrolls at 120px/s off global time,
  so it never resets at a cut. Flat fills only: no gradients, no glow.

  Camera windows are styled placeholders (a flat silhouette per host). A real build swaps each window
  for recorded footage of that host.

  Original by rule: a generic newsroom look only. No real network names, logos, show names or broadcast
  packages. Every ticker, price and host is fictional. Keep "Sample data · not financial advice".

  Edit the BEATS block (content and data) and BRAND block (paste your brand.json).
  Theme: ?theme=light, or change THEME.
  Render: python3 render.py video index.html out.mp4   (see references/style.md#styles)
-->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@700&family=IBM+Plex+Sans:wght@500;600&family=IBM+Plex+Mono:wght@700&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden}
body{background:var(--bg);color:var(--ink);position:relative;-webkit-font-smoothing:antialiased;
  --head:"IBM Plex Sans Condensed",sans-serif;--sans:"IBM Plex Sans",sans-serif;--mono:"IBM Plex Mono",monospace}
body.dark{--bg:#0B0F14;--panel:#141B24;--line:#26303D;--grid:#1D2530;--ink:#E8EDF3;--muted:#93A0B0;--acc:#F5B83D;--accInk:#1A1200;--up:#34D399;--down:#F87171;--cam:#1A222D;--sil:#2C3745;--sil2:#36424F;--liveInk:#1A0505}
body.light{--bg:#F3F4F6;--panel:#FFFFFF;--line:#D6DAE0;--grid:#E6E9EE;--ink:#0E141B;--muted:#4B5563;--acc:#8A5A00;--accInk:#FFFFFF;--up:#047857;--down:#B91C1C;--cam:#DDE2E8;--sil:#BFC7D1;--sil2:#AEB7C2;--liveInk:#FFFFFF}
.beat{position:absolute;inset:0;display:none}
.abs{position:absolute}
svg.full{position:absolute;left:0;top:0;overflow:visible}
.num{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums}
.kick{font:700 24px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.kick b{color:var(--acc)}
h1{font:700 190px/.9 var(--head);letter-spacing:-.02em;text-transform:uppercase;white-space:nowrap}
h2{font:700 84px/1 var(--head);letter-spacing:-.01em;white-space:nowrap}
h1 em,h2 em{font-style:normal;color:var(--acc)}
.up{color:var(--up)} .down{color:var(--down)}
h2 .up,h2 .down{font-style:normal}
.sub{font:500 36px/1.35 var(--sans);color:var(--muted)}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:20px}
.live{display:inline-flex;align-items:center;gap:12px;font:700 22px/1 var(--mono);letter-spacing:.14em;background:var(--down);color:var(--liveInk);padding:10px 16px;border-radius:8px}
.live i{width:12px;height:12px;border-radius:50%;background:currentColor}
.chip{display:inline-flex;align-items:center;gap:12px;font:700 30px/1 var(--mono);font-variant-numeric:tabular-nums;padding:14px 20px;border-radius:12px;background:var(--panel);border:2px solid var(--line);white-space:nowrap}
.chip.m{color:var(--muted)}
/* camera window: a placeholder for recorded footage of one host */
.cam{position:absolute;background:var(--cam);border-radius:28px;overflow:hidden}
.cam::after,.cam .ring{content:"";position:absolute;inset:0;border:3px solid var(--line);border-radius:inherit;pointer-events:none}
.cam .ring{border-color:var(--acc);opacity:0;z-index:2}
.cam svg{position:absolute;left:50%;bottom:0;transform:translateX(-50%)}
.cam .tag{position:absolute;left:24px;top:22px;font:700 20px/1 var(--mono);letter-spacing:.14em;color:var(--muted);white-space:nowrap}
.cam .tag span{color:var(--acc)}
.lt{position:absolute;left:24px;right:24px;bottom:24px;display:flex;align-items:stretch;border-radius:12px;overflow:hidden;background:var(--panel)}
.lt .bar{width:10px;background:var(--acc);flex:none}
.lt .tx{padding:16px 20px}
.lt .n{font:700 34px/1.05 var(--head)}
.lt .r{font:700 18px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.host{display:flex;align-items:center;gap:18px}
.host .cam{position:relative;width:110px;height:110px;border-radius:50%}
.host .n{font:700 32px/1 var(--head)}
.row{display:grid;grid-template-columns:170px 1fr;align-items:center;gap:30px;padding:24px 34px;border-top:2px solid var(--line)}
.row:first-child{border-top:0}
.row .t{font:700 30px/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--acc);white-space:nowrap}
.row .e{font:600 36px/1.15 var(--sans)}
.row .e small{display:block;font:500 24px/1.3 var(--sans);color:var(--muted);margin-top:6px}
/* the ticker tape is the same dark tape in both themes */
.tape{position:absolute;left:0;right:0;bottom:0;height:72px;background:#070A0E;overflow:hidden;z-index:10}
.tape .lab{position:absolute;left:0;top:0;z-index:2;height:100%;display:flex;align-items:center;padding:0 28px;background:#F5B83D;color:#1A1200;font:700 24px/1 var(--mono);letter-spacing:.14em}
.tape .run{position:absolute;left:0;top:0;height:100%;display:flex;align-items:center;white-space:nowrap;font:700 28px/1 var(--mono);font-variant-numeric:tabular-nums;color:#E8EDF3;will-change:transform}
.tape .set{display:flex;flex:none}
.tape .it{padding:0 23px}
.tape .it em{font-style:normal;margin-left:12px}
.tape .u{color:#34D399} .tape .d{color:#F87171}
.tape .sep{color:#4B5563;padding:0 23px}
</style></head>
<body>
<div id="stage"></div>
<div class="tape"><div class="run" id="run"></div><div class="lab">MARKETS</div></div>
<script>
/* ============ 1. CONTENT: edit these ============ */
const THEME = new URLSearchParams(location.search).get("theme") || "dark";   // "dark" | "light"
const BRAND = {};   // paste brand.json here; see references/style.md#brand

// Market's own finance sample (not the shared homelab-nut beats). Every name and number is fictional.
// Text marks: *word* = gold accent, [+word] = up colour, [-word] = down colour.
// Chart paths, chips and changes are computed from these arrays; edit the data, not the drawing.
const BEATS = {
  show: "Weeknight markets show",
  clock: "4:00 PM ET",
  // [name, role]: CAM 1, CAM 2, CAM 3
  hosts: [["Maya Chen", "Anchor"], ["Dev Patel", "Markets desk"], ["Sam Ortiz", "Guest · strategist"]],
  // the ticker: [symbol, price, % change, up]
  tape: [["TDEV 100", "18,412.6", 1.24, true], ["HNUT", "42.18", 3.10, true], ["ORBT", "118.04", 0.62, true],
    ["LEDG", "27.55", 1.84, false], ["PRMT", "9.31", 5.02, true], ["GSHW", "64.70", 0.45, false],
    ["WALK", "203.12", 0.18, true], ["USD/EUR", "0.9412", 0.07, false], ["10Y", "4.12%", 0.03, true], ["GOLD", "2,384", 0.41, true]],
  beats: [
    { type: "title", start: 0, end: 6, title: "The *Close*", sub: "What moved today, in five minutes.",
      series: [18140,18138,18130.9,18113.3,18128.4,18125.6,18127.3,18127,18127.1,18119.6,18109.7,18119.7,18106.9,18103.7,18109,18123.8,18121,18106.3,18097,18108.5,18114.3,18118.7,18120.1,18111.8,18106.5,18120.9,18103.8,18094.2,18099.8,18111.1,18094.4,18092.6,18110.9,18114.7,18101.6,18109,18130.5,18126.5,18145.7,18129.7,18141.7,18157.4,18178.8,18173.7,18163.9,18179.4,18200.9,18213.9,18237.6,18253.3,18254.4,18248.4,18256.9,18241.8,18263.9,18281.2,18279.3,18298.4,18282.6,18293.4,18315.7,18322,18333.5,18338.2,18356.8,18358.6,18380.2,18404.7,18406.3,18423.3,18428.3,18422,18408.7,18395.6,18413.5,18402.7,18401.6,18408.6,18408.7,18412.6] },
    { type: "chart", start: 6, end: 14, cam: 0, symbol: "TDEV 100", period: "intraday", prevClose: 18187.2, dp: 1, vol: "3.1B",
      axis: ["9:30", "11:00", "12:30", "2:00", "4:00"],
      series: [18172,18154.8,18145.6,18148.5,18150.9,18164.6,18153.6,18169.2,18185.3,18195,18198.4,18196.1,18208.6,18214.7,18216.6,18212.7,18215.6,18210.4,18226.4,18230.7,18245.3,18237,18229.2,18245.5,18253.7,18250,18262.4,18261,18275.2,18277.5,18280.7,18275.6,18266.6,18278.6,18292.9,18288.9,18299.9,18298.4,18312.6,18314,18302.4,18291.5,18281.1,18286.4,18283.9,18296.8,18295,18303,18321.5,18325.2,18336.8,18330.9,18339.6,18343.5,18339.9,18337,18341.1,18349,18352.1,18350.5,18354.6,18359.3,18352.3,18360.7,18374.7,18379.2,18385.6,18381.7,18394.6,18395.6,18388.5,18395.5,18397,18392.8,18398.1,18415.8,18417.6,18412.6] },
    { type: "bars", start: 14, end: 22, kicker: "Sector scorecard", meta: "Close · Nov 26", title: "Tech [+led], retail [-lagged].",
      sectors: [["Tech", 2.4], ["Energy", 1.6], ["Health", 0.8], ["Finance", 0.3], ["Utilities", -0.6], ["Retail", -1.4]],
      symbol: "HNUT", period: "10 days",
      // [open, close, high, low], oldest first; the change is the last close against the one before it
      candles: [[40.2,40.95,41.37,39.84],[40.95,40.87,41.09,40.75],[40.87,40.89,41.35,40.52],[40.89,41.26,41.47,40.63],[41.26,41.46,41.83,41.25],
        [41.46,42.14,42.53,41.45],[42.14,42.82,43.06,41.83],[42.82,42.41,43.24,41.92],[42.41,40.91,42.6,40.7],[40.91,42.18,42.35,40.8]] },
    // speakers: [seconds into the beat, camera index]; the gold border and ON AIR move between cameras
    { type: "panel", start: 22, end: 30, kicker: "The panel", speakers: [[0, 1], [3, 2], [5.6, 0]],
      question: "Is the rally in small caps real, or one good week?", change: 2.1, changeLabel: "wk" },
    { type: "outro", start: 30, end: 36, cam: 0, kicker: "Tomorrow", title: "What to *watch*.",
      watch: [["8:30 AM", "Jobs report", "Payrolls, unemployment rate"], ["10:00 AM", "Consumer sentiment", "Final read for November"],
        ["4:05 PM", "HNUT earnings", "Q3, call at 5:00 PM ET"]],
      cta: "Subscribe for tomorrow's close", note: "Sample data · not financial advice" } ] };

/* ============ 2. BRAND: brand.json overrides the board tokens ============ */
const STYLE = "market";
function applyBrand(b, theme) {
  const s = document.body.style, c = b.colors || {}, f = b.fonts || {};
  if (c.accent) s.setProperty("--acc", c.accent);
  if (c[theme]) s.setProperty("--bg", c[theme]);
  if (f.heading) s.setProperty("--head", `"${f.heading}",sans-serif`);
  if (f.body) s.setProperty("--sans", `"${f.body}",sans-serif`);
  if (f.mono) s.setProperty("--mono", `"${f.mono}",monospace`);
  const tok = ((b.styles || {})[STYLE] || {})[theme] || {};      // exact per-style tokens win
  for (const k in tok) s.setProperty(k.startsWith("--") ? k : "--" + k, tok[k]);
  if (b.name) BEATS.show = b.name;
}
document.body.className = STYLE + " " + THEME;
applyBrand(BRAND, THEME);

/* ============ 3. BUILD ============ */
const esc = s => String(s).replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
const mark = s => esc(s).replace(/\*(.+?)\*/g, "<em>$1</em>")
  .replace(/\[\+(.+?)\]/g, '<span class="up">$1</span>').replace(/\[-(.+?)\]/g, '<span class="down">$1</span>');
const fmt = (v, dp) => Number(v).toLocaleString("en-US", { minimumFractionDigits: dp, maximumFractionDigits: dp });
// a change always carries an arrow and a sign; the minus is a real minus sign
const chg = (v, dp, unit = "") => (v >= 0 ? "▲ +" : "▼ −") + fmt(Math.abs(v), dp) + unit;
const dir = v => v >= 0 ? "up" : "down";

// Flat host silhouettes: each variant has a different hair/head shape so the three hosts read apart.
function sil(w, h, v) {
  const cx = w / 2, hr = h * .17, hy = h * .42;
  const hair = v % 3 === 0
    ? `<path d="M${cx - hr * 1.05} ${hy - hr * .1} A${hr * 1.05} ${hr * 1.1} 0 0 1 ${cx + hr * 1.05} ${hy - hr * .1} L${cx + hr * 1.1} ${hy + hr * 1.2} L${cx - hr * 1.1} ${hy + hr * 1.2}Z" fill="var(--sil2)"/>`
    : v % 3 === 1 ? `<rect x="${cx - hr * 1.02}" y="${hy - hr * 1.12}" width="${hr * 2.04}" height="${hr * .7}" rx="${hr * .35}" fill="var(--sil2)"/>`
    : `<circle cx="${cx + hr * .55}" cy="${hy - hr * .95}" r="${hr * .45}" fill="var(--sil2)"/>`;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${v % 3 === 0 ? hair : ""}<circle cx="${cx}" cy="${hy}" r="${hr}" fill="var(--sil)"/>${v % 3 ? hair : ""}
    <path d="M${cx - h * .36} ${h} C${cx - h * .36} ${h * .72} ${cx - h * .2} ${h * .66} ${cx} ${h * .66} C${cx + h * .2} ${h * .66} ${cx + h * .36} ${h * .72} ${cx + h * .36} ${h}Z" fill="var(--sil)"/></svg>`;
}
// A camera window. Swap it for that host's footage in a real build.
const cam = (x, y, w, h, i) => `<div class="cam" data-cam="${i}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">${sil(w * .9, h * .86, i)}
  <div class="ring"></div><div class="tag">CAM ${i + 1}<span class="onair"> · ON AIR</span></div>
  <div class="lt"><div class="bar"></div><div class="tx"><div class="n">${esc(BEATS.hosts[i][0])}</div><div class="r">${esc(BEATS.hosts[i][1])}</div></div></div></div>`;

// An intraday line from data: grid, optional dashed reference, flat 12% area, a line that draws, and an end dot.
function lineChart({ data, x, y, w, h, rows = 3, axis = [], ref, refLabel, d = .3 }) {
  const lo = Math.min(...data, ref ?? Infinity), hi = Math.max(...data, ref ?? -Infinity), pad = (hi - lo) * .06;
  const Y = v => y + h - (v - lo + pad) / (hi - lo + 2 * pad) * h;
  const pts = data.map((v, i) => [x + i / (data.length - 1) * w, Y(v)]);
  const path = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const id = "c" + Math.random().toString(36).slice(2, 8);
  let g = "";
  for (let i = 0; i <= rows; i++) g += `<line x1="${x}" x2="${x + w}" y1="${y + i * h / rows}" y2="${y + i * h / rows}" stroke="var(--grid)" stroke-width="2"/>`;
  axis.forEach((l, i) => g += `<text x="${x + i * w / (axis.length - 1)}" y="${y + h + 44}" fill="var(--muted)" font-family="IBM Plex Mono" font-weight="700" font-size="22" text-anchor="${i ? i === axis.length - 1 ? "end" : "middle" : "start"}">${esc(l)}</text>`);
  if (ref != null) g += `<line x1="${x}" x2="${x + w}" y1="${Y(ref)}" y2="${Y(ref)}" stroke="var(--muted)" stroke-width="2" stroke-dasharray="6 10"/>
    <text x="${x + w}" y="${Y(ref) - 14}" fill="var(--muted)" font-family="IBM Plex Mono" font-weight="700" font-size="20" text-anchor="end">${esc(refLabel)}</text>`;
  const col = `var(--${dir(data.at(-1) - data[0])})`;
  return `${g}<clipPath id="${id}"><rect class="reveal" x="${x}" y="${y - 40}" width="0" height="${h + 80}"/></clipPath>
    <path d="${path} L${x + w} ${y + h} L${x} ${y + h}Z" fill="${col}" opacity=".12" clip-path="url(#${id})"/>
    <path class="draw" data-d="${d}" d="${path}" fill="none" stroke="${col}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle class="dot" r="11" fill="${col}" opacity="0"/>`;
}

const hdr = (l, r) => `<div class="abs kick" style="left:96px;top:56px"><b>●</b> ${esc(l)}</div>
  <div class="abs kick" style="right:96px;top:56px;display:flex;gap:22px;align-items:center">${r}</div>`;
const live = `<span class="live"><i></i>LIVE</span>`;

// data-in = entrance delay (s); data-fx = rise (default) | fade | count | grow | print
const B = {
  title: b => `${hdr(BEATS.show, `${live}<span>${esc(BEATS.clock)}</span>`)}
    <svg class="full" width="1920" height="1080">${lineChart({ data: b.series, x: 96, y: 130, w: 1728, h: 300, d: .2 })}</svg>
    <h1 class="abs" data-in=".5" style="left:96px;top:470px">${mark(b.title)}</h1>
    <div class="abs sub" data-in=".9" data-fx="fade" style="left:96px;top:660px">${esc(b.sub)}</div>
    <div class="abs" style="left:96px;top:790px;display:flex;gap:56px">${BEATS.hosts.map((h, i) => `<div class="host" data-in="${1.2 + i * .15}" data-fx="fade">
      <div class="cam">${sil(100, 96, i)}</div><div><div class="n">${esc(h[0])}</div><div class="kick" style="font-size:18px;margin-top:8px">${esc(h[1])}</div></div></div>`).join("")}</div>`,
  chart: b => {
    const last = b.series.at(-1), d = last - b.prevClose, pct = d / b.prevClose * 100;
    return `${cam(60, 60, 840, 880, b.cam)}
    <div class="abs kick" style="left:960px;top:96px"><b>●</b> ${esc(b.symbol)} · ${esc(b.period)}</div>
    <div class="abs num" data-fx="count" data-in=".2" data-from="${b.prevClose}" data-to="${last}" data-dp="${b.dp}" style="left:960px;top:150px;font-size:120px;letter-spacing:-.03em;line-height:1.1"></div>
    <div class="abs" data-in=".6" data-fx="fade" style="left:960px;top:300px;display:flex;gap:16px">
      <span class="chip ${dir(d)}">${chg(d, b.dp)}</span><span class="chip ${dir(d)}">${chg(pct, 2, "%")}</span><span class="chip m">VOL ${esc(b.vol)}</span></div>
    <svg class="full" width="1920" height="1080">${lineChart({ data: b.series, x: 960, y: 420, w: 880, h: 440, rows: 4, axis: b.axis,
      ref: b.prevClose, refLabel: "PREV CLOSE " + fmt(b.prevClose, b.dp), d: .5 })}</svg>`; },
  bars: b => {
    const zx = 640, top = 330, pitch = 96, max = Math.max(...b.sectors.map(s => Math.abs(s[1]))), sc = 340 / max;
    const bars = b.sectors.map(([n, v], i) => {
      const yy = top + i * pitch, w = Math.abs(v) * sc, up = v >= 0;
      return `<text x="96" y="${yy + 42}" fill="var(--ink)" font-family="IBM Plex Sans" font-weight="600" font-size="34">${esc(n)}</text>
        <rect data-fx="grow" data-in="${.5 + i * .08}" data-x0="${zx}" data-w="${w}" data-up="${up ? 1 : 0}" x="${zx}" y="${yy + 6}" width="0" height="52" rx="8" fill="var(--${dir(v)})"/>
        <text data-fx="fade" data-in="${.9 + i * .08}" x="${up ? zx + w + 16 : zx - w - 16}" y="${yy + 44}" fill="var(--${dir(v)})" font-family="IBM Plex Mono" font-weight="700" font-size="30" text-anchor="${up ? "start" : "end"}">${chg(v, 1, "%")}</text>`;
    }).join("");
    const K = b.candles, lo = Math.min(...K.map(k => k[3])), hi = Math.max(...K.map(k => k[2])), Y = v => 870 - (v - lo) / (hi - lo) * 380;
    const cw = 34, step = 560 / K.length;
    const candles = K.map(([o, c, h, l], i) => {
      const x = 1222 + i * step + (step - cw) / 2, col = `var(--${c >= o ? "up" : "down"})`;
      return `<g data-fx="print" data-in="${.8 + i * .1}"><line x1="${x + cw / 2}" x2="${x + cw / 2}" y1="${Y(h)}" y2="${Y(l)}" stroke="${col}" stroke-width="4"/>
        <rect x="${x}" y="${Y(Math.max(o, c))}" width="${cw}" height="${Math.max(6, Math.abs(Y(o) - Y(c)))}" rx="4" fill="${c >= o ? col : "var(--panel)"}" stroke="${col}" stroke-width="4"/></g>`;
    }).join("");
    const last = K.at(-1)[1], prev = K.at(-2)[1], pct = (last - prev) / prev * 100;
    return `${hdr(b.kicker, esc(b.meta))}
    <h2 class="abs" data-in=".2" style="left:96px;top:120px">${mark(b.title)}</h2>
    <svg class="full" width="1920" height="1080"><line x1="${zx}" x2="${zx}" y1="${top - 20}" y2="${top + b.sectors.length * pitch - 10}" stroke="var(--line)" stroke-width="3"/>${bars}</svg>
    <div class="abs panel" data-in=".4" data-fx="fade" style="left:1180px;top:300px;width:650px;height:620px">
      <div class="kick" style="position:absolute;left:40px;top:40px"><b>${esc(b.symbol)}</b> · ${esc(b.period)}</div>
      <div class="num" style="position:absolute;left:40px;top:80px;font-size:56px;white-space:nowrap">${fmt(last, 2)} <span class="${dir(pct)}" style="font-size:34px">${chg(pct, 2, "%")}</span></div></div>
    <svg class="full" width="1920" height="1080">${candles}</svg>`; },
  panel: b => `${hdr(b.kicker, live)}
    ${cam(60, 110, 580, 640, 0)}${cam(670, 110, 580, 640, 1)}${cam(1280, 110, 580, 640, 2)}
    <div class="abs panel" data-in=".3" data-fx="fade" style="left:60px;right:60px;top:790px;height:170px;display:flex;align-items:center;gap:36px;padding:0 40px">
      <span class="kick" style="flex:none"><b>Q</b> · tonight</span>
      <span style="font:700 52px/1.1 var(--head);flex:1">${esc(b.question)}</span>
      <span class="chip ${dir(b.change)}" style="flex:none">${chg(b.change, 1, "%")} ${esc(b.changeLabel)}</span></div>`,
  outro: b => `${cam(1020, 60, 840, 880, b.cam)}
    <div class="abs kick" style="left:96px;top:96px"><b>●</b> ${esc(b.kicker)}</div>
    <h2 class="abs" data-in=".2" style="left:96px;top:150px">${mark(b.title)}</h2>
    <div class="abs panel" data-in=".4" data-fx="fade" style="left:96px;top:300px;width:860px">
      ${b.watch.map((w, j) => `<div class="row" data-in="${.6 + j * .15}" data-fx="fade"><span class="t">${esc(w[0])}</span><span class="e">${esc(w[1])}<small>${esc(w[2])}</small></span></div>`).join("")}</div>
    <div class="abs" data-in="1.2" data-fx="fade" style="left:96px;top:800px"><span class="chip" style="border-radius:999px;padding:14px 28px"><span style="color:var(--acc)">●</span> ${esc(b.cta)}</span></div>
    <div class="abs kick" data-in="1.4" data-fx="fade" style="left:96px;top:900px;font-size:18px">${esc(b.note)}</div>`,
};

const stageEl = document.getElementById("stage");
const S = BEATS.beats.map(b => {
  const el = document.createElement("section"); el.className = "beat"; el.innerHTML = B[b.type](b); stageEl.appendChild(el);
  const items = [...el.querySelectorAll("[data-in]")].map(e => ({ e, d: +e.dataset.in, fx: e.dataset.fx || "rise" }));
  const lines = [...el.querySelectorAll("path.draw")].map(p => ({ p, d: +p.dataset.d, L: p.getTotalLength(),
    dot: p.nextElementSibling, reveal: p.parentNode.querySelector("rect.reveal") }));
  lines.forEach(l => { l.p.style.strokeDasharray = l.L; l.x0 = +l.reveal.getAttribute("x"); });
  const cams = [...el.querySelectorAll(".cam[data-cam]")];
  return { b, el, items, lines, cams };
});

// The ticker: enough copies of the list to always cover the screen, scrolled from global time.
const tapeSet = `<div class="set">${BEATS.tape.map(([s, p, c, up]) =>
  `<span class="it">${esc(s)} ${esc(p)}<em class="${up ? "u" : "d"}">${up ? "▲ +" : "▼ −"}${fmt(c, 2)}%</em></span><span class="sep">|</span>`).join("")}</div>`;
const run = document.getElementById("run");
run.innerHTML = tapeSet.repeat(4);
["700 100px 'IBM Plex Sans Condensed'", "500 36px 'IBM Plex Sans'", "600 36px 'IBM Plex Sans'", "700 30px 'IBM Plex Mono'"].forEach(f => document.fonts.load(f));

/* ============ 4. HELPERS ============ */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, s, d) => clamp((t - s) / d);
const eo = x => 1 - Math.pow(1 - x, 3);
const TAPE_SPEED = 120;   // px/s, constant, never resets at a cut

/* ============ 5. RENDER: pure function of t ============ */
window.DURATION = BEATS.beats[BEATS.beats.length - 1].end;
window.render = function (t) {
  const setW = run.firstElementChild.offsetWidth || 1;
  run.style.transform = `translateX(${(180 - (TAPE_SPEED * t) % setW).toFixed(2)}px)`;
  S.forEach(({ b, el, items, lines, cams }, i) => {
    const last = i === S.length - 1, on = t >= b.start && (t < b.end || last);
    el.style.display = on ? "block" : "none"; if (!on) return;     // hard cuts, like a live switcher
    const u = t - b.start;
    for (const it of items) {
      const e = it.e, s = e.style;
      if (it.fx === "rise") { const p = eo(P(u, it.d, .5)); s.opacity = p; s.transform = `translateY(${(1 - p) * 30}px)`; }
      else if (it.fx === "fade") { const p = eo(P(u, it.d, .4)); s.opacity = p; }
      else if (it.fx === "count") { const p = eo(P(u, it.d, 1.2)), a = +e.dataset.from, z = +e.dataset.to;
        e.textContent = fmt(a + (z - a) * p, +e.dataset.dp); }
      else if (it.fx === "grow") { const p = eo(P(u, it.d, .5)), w = +e.dataset.w * p;
        e.setAttribute("width", w.toFixed(1)); e.setAttribute("x", (e.dataset.up === "1" ? +e.dataset.x0 : +e.dataset.x0 - w).toFixed(1)); }
      else if (it.fx === "print") { s.opacity = u >= it.d ? 1 : 0; }
    }
    for (const l of lines) {   // draw left to right over 1.2s; the dot rides the tip and stays at the end
      const p = eo(P(u, l.d, 1.2)), pt = l.p.getPointAtLength(l.L * p);
      l.p.style.strokeDashoffset = (l.L * (1 - p)).toFixed(1);
      l.reveal.setAttribute("width", Math.max(0, pt.x - l.x0).toFixed(1));
      l.dot.setAttribute("cx", pt.x.toFixed(1)); l.dot.setAttribute("cy", pt.y.toFixed(1));
      l.dot.setAttribute("opacity", u >= l.d ? 1 : 0);
    }
    if (cams.length) {   // the gold border and ON AIR move to the speaker over 0.2s
      const sp = b.speakers || [[0, b.cam]];
      let cur = sp[0][1], prev = cur, at = -1;
      for (const [s, c] of sp) if (u >= s) { if (s > 0) { prev = cur; at = s; } cur = c; }
      const k = at < 0 ? 1 : P(u, at, .2);
      cams.forEach(c => { const n = +c.dataset.cam, v = n === cur ? k : n === prev && prev !== cur ? 1 - k : 0;
        c.querySelector(".ring").style.opacity = v; c.querySelector(".onair").style.opacity = v; });
    }
  });
};
window.render(0);
</script>
</body></html>
