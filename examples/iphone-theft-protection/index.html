<!DOCTYPE html>
<!--
  Walkthrough: step-by-step how-to. For settings guides, setup videos and how-tos, one action per step.
  An original, generic drawn handset (no real device frame, no OS screenshots, no platform icons), numbered steps,
  a row highlight with a tap ring, and one caption per step. Navy / cool grey, one teal accent, Manrope + IBM Plex Mono.
  Motion: the screen slides 0.3s, then the row highlight draws, the tap ring pulses once and the toggle flips.
  Captions crossfade in 0.2s.

  Example: iPhone theft protection (every step is from the Apple Support article cited in SRC).
  Edit the BEATS block (content and phone screens) and BRAND block (paste your brand.json).
  Theme: ?theme=light, or change THEME. Render: python3 render.py video index.html out.mp4
-->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=IBM+Plex+Mono:wght@500;600&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden}
body{background:var(--bg);color:var(--ink);position:relative;-webkit-font-smoothing:antialiased;
  --sans:Manrope,sans-serif;--mono:"IBM Plex Mono",monospace;font-family:var(--sans)}
body.dark{--bg:#0E1420;--surf:#172033;--line:#2A3650;--ink:#F1F5F9;--muted:#A3B1C6;--acc:#2DD4BF;--accInk:#06201C;--tap:#FFB020;--tapInk:#1A1203;
  --phone:#2A3650;--screen:#0B0F17;--row:#161D2B;--rowInk:#E8EDF5;--rowMuted:#94A3B8;--on:#2DD4BF;--off:#3A465E;--camBg:#1A2232;--camFg:#2C3850;--camLbl:#C9D3E2}
body.light{--bg:#EEF2F7;--surf:#FFFFFF;--line:#CBD5E1;--ink:#0F172A;--muted:#475569;--acc:#0F766E;--accInk:#FFFFFF;--tap:#B45309;--tapInk:#FFFFFF;
  --phone:#0F172A;--screen:#FFFFFF;--row:#F1F5F9;--rowInk:#0F172A;--rowMuted:#475569;--on:#0F766E;--off:#CBD5E1;--camBg:#DCE3EC;--camFg:#BCC7D6;--camLbl:#1E293B}
.beat{position:absolute;inset:0;display:none}
.abs{position:absolute}
.kick{font:600 26px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kick b{color:var(--acc);font-weight:600}
h1{font:800 120px/1 var(--sans);letter-spacing:-.035em}
h2{font:800 88px/1.02 var(--sans);letter-spacing:-.03em}
.sub{font:500 40px/1.35 var(--sans);color:var(--muted)}
.badge{display:inline-flex;align-items:center;justify-content:center;width:120px;height:120px;border-radius:50%;background:var(--acc);color:var(--accInk);font:800 68px/1 var(--sans)}
.dots{display:flex;gap:14px}.dots i{width:64px;height:10px;border-radius:5px;background:var(--line)}.dots i.on{background:var(--acc)}
.cap{display:inline-block;background:var(--surf);border:3px solid var(--acc);color:var(--ink);font:700 48px/1.2 var(--sans);padding:24px 34px;border-radius:18px;max-width:820px}
/* phone: an original generic handset, drawn in CSS */
.phone{position:absolute;left:1240px;top:40px;width:520px;height:1000px;border-radius:70px;background:var(--phone);padding:22px}
.scr{width:100%;height:100%;border-radius:50px;background:var(--screen);overflow:hidden;position:relative}
.scr .in{position:absolute;inset:0}
.cam-dot{position:absolute;left:50%;top:22px;width:18px;height:18px;border-radius:50%;background:var(--phone);transform:translateX(-50%);z-index:3}
.sbar{height:70px}
.ttl{font:800 46px/1 var(--sans);color:var(--rowInk);padding:20px 34px 26px}
.back{font:700 26px/1 var(--sans);color:var(--acc);padding:0 34px}
.grp{margin:0 22px 22px;background:var(--row);border-radius:22px;overflow:hidden}
.r{display:flex;align-items:center;gap:20px;padding:0 26px;height:92px;border-top:1px solid var(--line);font:700 28px/1.15 var(--sans);color:var(--rowInk);position:relative}
.r:first-child{border-top:0}
.r .ic{width:48px;height:48px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.r .ic svg{width:28px;height:28px}
.r small{display:block;font:500 21px/1.2 var(--sans);color:var(--rowMuted)}
.r .chev{margin-left:auto;color:var(--rowMuted);font-weight:800}
.r .chk{margin-left:auto;color:var(--acc);font-size:34px;font-weight:800}
.tg{margin-left:auto;width:84px;height:48px;border-radius:24px;background:var(--off);position:relative;flex:none}
.tg i{position:absolute;top:5px;left:5px;width:38px;height:38px;border-radius:50%;background:#FFFFFF}
.note{font:500 22px/1.35 var(--sans);color:var(--rowMuted);padding:0 40px 18px}
.note.h{padding-top:8px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.src{font:500 22px/1 var(--mono);color:var(--muted);left:140px;bottom:40px}
.hl{position:absolute;border:4px solid var(--tap);pointer-events:none;z-index:2}
.tapring{position:absolute;width:84px;height:84px;border-radius:50%;border:6px solid var(--tap);z-index:2}
.tapring::after{content:"";position:absolute;inset:16px;border-radius:50%;background:var(--tap)}
/* checklist card */
.card{background:var(--surf);border:2px solid var(--line);border-radius:28px;padding:40px 48px}
.ck{display:flex;align-items:center;gap:26px;padding:26px 0;border-top:2px solid var(--line);font:700 40px/1.2 var(--sans)}
.ck:first-child{border-top:0}
.ck .t{width:56px;height:56px;border-radius:50%;background:var(--acc);color:var(--accInk);display:flex;align-items:center;justify-content:center;font:800 32px/1 var(--sans);flex:none}
.ck .t.o{background:transparent;border:4px solid var(--line);color:var(--muted)}
.ck small{display:block;font:500 28px/1.3 var(--sans);color:var(--muted)}
/* path panel (the terminal slot) */
.path{background:var(--surf);border:2px solid var(--line);border-radius:28px;padding:56px 64px;font:500 44px/1.9 var(--mono)}
.path .n{display:inline-flex;width:56px;height:56px;border-radius:50%;background:var(--acc);color:var(--accInk);font:700 30px/1 var(--sans);align-items:center;justify-content:center;margin-right:28px;vertical-align:6px}
.path .s{color:var(--muted)}
.path .hit{background:var(--tap);color:var(--tapInk);padding:2px 12px;border-radius:8px;font-weight:600}
.cam{position:absolute;background:var(--camBg);overflow:hidden}
.cam .head{position:absolute;left:50%;top:22%;width:220px;height:220px;border-radius:50%;background:var(--camFg);transform:translateX(-50%)}
.cam .body{position:absolute;left:50%;top:48%;width:560px;height:440px;border-radius:200px 200px 0 0;background:var(--camFg);transform:translateX(-50%)}
.cam .lbl{position:absolute;left:28px;top:24px;font:600 22px/1 var(--mono);color:var(--camLbl);letter-spacing:.06em}
.cam .lbl b{color:#ff4d4d}
</style></head>
<body>
<!-- generic drawn glyphs for the settings rows; no platform icons -->
<svg width="0" height="0" style="position:absolute">
 <symbol id="shield" viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5z" fill="currentColor"/></symbol>
 <symbol id="gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="currentColor"/><circle cx="12" cy="12" r="3.5" fill="#fff"/></symbol>
 <symbol id="key" viewBox="0 0 24 24"><circle cx="8" cy="12" r="5" fill="currentColor"/><rect x="11" y="10.5" width="11" height="3" fill="currentColor"/><rect x="18" y="13" width="3" height="4" fill="currentColor"/></symbol>
 <symbol id="pin" viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 1 7 7c0 5-7 13-7 13S5 14 5 9a7 7 0 0 1 7-7z" fill="currentColor"/><circle cx="12" cy="9" r="2.6" fill="#fff"/></symbol>
 <symbol id="bell" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 1 6 6v5l2 3H4l2-3V9a6 6 0 0 1 6-6z" fill="currentColor"/><circle cx="12" cy="20" r="2" fill="currentColor"/></symbol>
</svg>
<div id="stage"></div>
<script>
/* ============ 1. CONTENT: edit these ============ */
const THEME = new URLSearchParams(location.search).get("theme") || "dark";   // "dark" | "light"
const BRAND = {};   // paste brand.json here; see references/style.md#brand

// Phone screens. A row is { label, sub?, icon?, color?, end: "chev" | "check" | "toggle", id? }.
// Steps point at a row by its id. Keep the UI generic: your own drawn rows, never a real OS screenshot.
const SRC = "support.apple.com/en-us/120340";   // Apple Support: About Stolen Device Protection for iPhone (iOS 17.3 or later)
const SCREENS = {
  home: { title: "Settings", groups: [
    [ { label: "Notifications", icon: "bell", color: "#E5484D", end: "chev" },
      { label: "General", icon: "gear", color: "#64748B", end: "chev" },
      { label: "Face ID & Passcode", icon: "key", color: "#16A34A", end: "chev", id: "faceid" },
      { label: "Privacy & Security", icon: "shield", color: "#2563EB", end: "chev" } ],
    [ { label: "Find My", icon: "pin", color: "#16A34A", end: "chev" } ] ] },
  passcode: { back: "Settings", title: "Face ID &<br>Passcode", groups: [
    [ { label: "Change Passcode", end: "chev" } ],
    [ { label: "Stolen Device Protection", end: "chev", id: "sdprow" } ] ] },
  sdp: { back: "Face ID & Passcode", title: "Stolen Device<br>Protection", groups: [
    [ { label: "Stolen Device Protection", end: "toggle", id: "sdp" } ],
    { note: "Require Security Delay", head: true },
    [ { label: "Away from Familiar Locations", end: "check", id: "away" },
      { label: "Always", end: "none", id: "always" } ] ] },
};

const BEATS = {
  steps: 4,
  beats: [
    { type: "title", start: 0, end: 5, kicker: "How-to", meta: "4 steps · iOS 17.3 or later",
      title: "Lock down your iPhone before it's stolen.",
      sub: "Turn on Stolen Device Protection and set the Security Delay to Always.", screen: "home", src: SRC },
    { type: "card", start: 5, end: 11, kicker: "Before you start", meta: "what it needs", title: "Check these first.",
      items: [
        { text: "Two-factor authentication", note: "on your Apple Account" },
        { text: "A passcode, plus Face ID or Touch ID", note: "both set up on this iPhone" },
        { text: "Significant Locations on", note: "Privacy & Security → Location Services → System Services" },
        { text: "Find My on", note: "it can't be turned off while this is on" } ], src: SRC },
    { type: "step", start: 11, end: 16, n: 1, title: "Tap Face ID & Passcode.", sub: "Enter your passcode when it asks. (Touch ID models: Touch ID & Passcode.)",
      caption: "Open it from Settings.", screen: "home", tap: "faceid", src: SRC },
    { type: "step", start: 16, end: 21, n: 2, title: "Tap Stolen Device Protection.", sub: "It's on the Face ID & Passcode screen.",
      caption: "Open the setting.", screen: "passcode", tap: "sdprow", src: SRC },
    { type: "step", start: 21, end: 26, n: 3, title: "Turn Stolen Device Protection on.", sub: "It may already be on by default.",
      caption: "Flip the switch at the top.", screen: "sdp", tap: "sdp", flip: true, src: SRC },
    { type: "step", start: 26, end: 31, n: 4, title: "Choose Always.", sub: "Under Require Security Delay.",
      caption: "Applies even at home.", screen: "sdp", tap: "always", src: SRC },
    { type: "terminal", start: 31, end: 37, kicker: "The path", meta: "where it lives", title: "Settings, then three taps.",
      path: ["Settings", "Face ID & Passcode", "*Stolen Device Protection*", "Require Security Delay → Always"], src: SRC },
    { type: "caption", start: 37, end: 41, n: 3, text: "Turn it on, then choose Always." },
    { type: "outro", start: 41, end: 47, kicker: "Done", meta: "4 of 4", title: "You're protected.",
      sub: "Away from familiar places, or on Always, changing your Apple Account password or passcode now needs Face ID or Touch ID and a one-hour wait.",
      next: "Turn it off before you sell or trade in.", screen: "sdp", src: SRC } ] };

/* ============ 2. BRAND: brand.json overrides the board tokens ============ */
const STYLE = "walkthrough";
function applyBrand(b, theme) {
  const s = document.body.style, c = b.colors || {}, f = b.fonts || {};
  if (c.accent) { s.setProperty("--acc", c.accent); s.setProperty("--on", c.accent); }
  if (c[theme]) s.setProperty("--bg", c[theme]);
  if (f.heading) s.setProperty("--sans", `"${f.heading}",sans-serif`);
  if (f.mono) s.setProperty("--mono", `"${f.mono}",monospace`);
  const tok = ((b.styles || {})[STYLE] || {})[theme] || {};
  for (const k in tok) s.setProperty(k.startsWith("--") ? k : "--" + k, tok[k]);
}
document.body.className = STYLE + " " + THEME;
applyBrand(BRAND, THEME);

/* ============ 3. BUILD ============ */
const esc = s => String(s).replace(/[&<>]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[m]));
const ic = (id, c) => `<span class="ic" style="background:${c}"><svg><use href="#${id}"/></svg></span>`;
const row = r => `<div class="r"${r.id ? ` data-id="${r.id}"` : ""}>${r.icon ? ic(r.icon, r.color) : ""}<span>${esc(r.label)}${r.sub ? `<small>${esc(r.sub)}</small>` : ""}</span>${
  r.end === "chev" ? '<span class="chev">›</span>' : r.end === "check" ? '<span class="chk">✓</span>' : r.end === "toggle" ? '<span class="tg"><i></i></span>' : ""}</div>`;
const screen = k => { const s = SCREENS[k];
  return `${s.back ? `<div class="back">‹ ${esc(s.back)}</div>` : ""}<div class="ttl">${s.title}</div>${s.groups.map(g => Array.isArray(g)
    ? `<div class="grp">${g.map(row).join("")}</div>` : `<div class="note${g.head ? " h" : ""}">${esc(g.note)}</div>`).join("")}`; };
const phone = k => `<div class="phone"><div class="scr"><div class="cam-dot"></div><div class="in"><div class="sbar"></div>${screen(k)}</div>
  <div class="hl" style="display:none"></div><div class="tapring" style="display:none"></div></div></div>`;
const dots = n => `<div class="abs dots" data-in=".1" style="left:140px;top:760px">${Array.from({ length: BEATS.steps }, (_, j) => `<i${j < n ? ' class="on"' : ""}></i>`).join("")}</div>`;
// data-in = crossfade-in time (s), 0.2s
const B = {
  title: b => `<div class="abs kick" data-in=".1" style="left:140px;top:250px"><b>${esc(b.kicker)}</b> · ${esc(b.meta)}</div>
    <h1 class="abs" data-in=".2" style="left:134px;top:310px;width:1000px">${esc(b.title)}</h1>
    <div class="abs sub" data-in=".4" style="left:140px;top:700px;width:900px">${esc(b.sub)}</div>${phone(b.screen)}`,
  card: b => `<div class="abs kick" data-in=".1" style="left:140px;top:170px"><b>${esc(b.kicker)}</b> · ${esc(b.meta)}</div>
    <h2 class="abs" data-in=".2" style="left:140px;top:230px;width:640px">${esc(b.title)}</h2>
    <div class="abs card" data-in=".3" style="left:860px;top:150px;width:920px">${b.items.map((it, j) =>
      `<div class="ck" data-in="${.6 + j * .25}"><span class="t${it.done ? "" : " o"}">${it.done ? "✓" : j + 1}</span><span>${esc(it.text)}<small>${esc(it.note)}</small></span></div>`).join("")}</div>`,
  step: b => `<div class="abs kick" data-in=".05" style="left:140px;top:170px">Step ${b.n} of ${BEATS.steps}</div>
    <div class="abs" data-in=".05" style="left:140px;top:230px"><span class="badge">${b.n}</span></div>
    <div class="abs" style="left:140px;top:400px;width:900px"><h2 data-in=".1">${esc(b.title)}</h2>
      <div class="sub" data-in=".2" style="margin-top:20px;width:880px">${esc(b.sub)}</div></div>
    ${dots(b.n)}<div class="abs" data-in=".3" style="left:140px;top:850px"><div class="cap">${esc(b.caption)}</div></div>${phone(b.screen)}`,
  terminal: b => `<div class="abs kick" data-in=".1" style="left:140px;top:170px"><b>${esc(b.kicker)}</b> · ${esc(b.meta)}</div>
    <h2 class="abs" data-in=".2" style="left:140px;top:230px;width:1600px">${esc(b.title)}</h2>
    <div class="abs path" data-in=".3" style="left:140px;top:420px;width:1640px">${b.path.map((p, j) =>
      `<div data-in="${.6 + j * .35}"><span class="n">${j + 1}</span>${j ? '<span class="s">›</span> ' : ""}${esc(p).replace(/\*(.+?)\*/, '<span class="hit">$1</span>').replace("→", '<span class="s">→</span>')}</div>`).join("")}</div>`,
  caption: b => `<div class="cam" style="inset:0"><div class="head"></div><div class="body"></div><div class="lbl"><b>●</b> TALKING HEAD</div></div>
    <div class="abs" data-in=".1" style="left:110px;bottom:110px;display:flex;align-items:center;gap:22px">
      <span class="badge" style="width:96px;height:96px;font-size:54px">${b.n}</span><div class="cap" style="max-width:1200px;font-size:56px">${esc(b.text)}</div></div>`,
  outro: b => `<div class="abs kick" data-in=".1" style="left:140px;top:200px"><b>${esc(b.kicker)}</b> · ${esc(b.meta)}</div>
    <h1 class="abs" data-in=".2" style="left:134px;top:260px;width:1000px">${esc(b.title)}</h1>
    <div class="abs dots" data-in=".3" style="left:140px;top:420px">${"<i class=\"on\"></i>".repeat(BEATS.steps)}</div>
    <div class="abs sub" data-in=".4" style="left:140px;top:500px;width:940px">${esc(b.sub)}</div>
    <div class="abs" data-in=".6" style="left:140px;top:820px"><div class="cap">${esc(b.next)}</div></div>${phone(b.screen)}`,
};
const stage = document.getElementById("stage");
let prevScreen = null, flipped = new Set();
const S = BEATS.beats.map((b, i) => {
  const el = document.createElement("section"); el.className = "beat"; el.innerHTML = B[b.type](b, i) + (b.src ? `<div class="abs src" data-in=".1">Source: ${esc(b.src)}</div>` : ""); stage.appendChild(el);
  const s = { b, el, items: [...el.querySelectorAll("[data-in]")].map(e => ({ e, d: +e.dataset.in })) };
  if (b.screen) {
    s.slide = b.screen !== prevScreen; prevScreen = b.screen;           // slide only when the screen changes
    s.inner = el.querySelector(".scr .in"); s.hl = el.querySelector(".hl"); s.ring = el.querySelector(".tapring");
    s.target = b.tap ? el.querySelector(`.r[data-id="${b.tap}"]`) : null;
    s.toggles = [...el.querySelectorAll(".r[data-id]")].filter(r => r.querySelector(".tg"))
      .map(r => ({ r, on: flipped.has(r.dataset.id), flip: b.flip && r.dataset.id === b.tap }));
    if (b.flip) flipped.add(b.tap);
    s.phone = el.querySelector(".phone");
  }
  return s;
});
["800 100px Manrope", "700 40px Manrope", "500 40px Manrope", "500 40px 'IBM Plex Mono'", "600 26px 'IBM Plex Mono'"].forEach(f => document.fonts.load(f));

/* ============ 4. HELPERS ============ */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, s, d) => clamp((t - s) / d);
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

/* ============ 5. RENDER: pure function of t ============ */
// step timing (s from beat start): screen slide 0–0.3, highlight draws 0.45–0.75, tap pulse 0.8–1.4, toggle flips at 1.0
window.DURATION = BEATS.beats[BEATS.beats.length - 1].end;
window.render = function (t) {
  S.forEach((s, i) => {
    const { b, el, items } = s, last = i === S.length - 1, on = t >= b.start && (t < b.end || last);
    el.style.display = on ? "block" : "none"; if (!on) return;
    const u = t - b.start;
    for (const it of items) it.e.style.opacity = eo(P(u, it.d, .2));     // 0.2s crossfades
    if (!s.phone) return;
    if (b.type === "title") s.phone.style.transform = `translateX(${(1 - eo(P(u, .2, .5))) * 700}px)`;
    s.inner.style.transform = s.slide && b.type !== "title" ? `translateX(${(1 - eio(P(u, 0, .3))) * 100}%)` : "none";
    if (s.target) {
      const r = s.target, x = r.offsetLeft, y = r.offsetTop;   // relative to .in, which shares the screen origin
      const d = eio(P(u, .45, .3));                                     // highlight draws left to right
      Object.assign(s.hl.style, { display: d > 0 ? "block" : "none", left: x + "px", top: y + "px", width: r.offsetWidth + "px",
        height: r.offsetHeight + "px", clipPath: `inset(0 ${(1 - d) * 100}% 0 0)` });
      const tg = r.querySelector(".tg,.chk"), cx = tg ? x + tg.offsetLeft + tg.offsetWidth / 2 : x + r.offsetWidth * .82, cy = y + r.offsetHeight / 2;
      const p = P(u, .8, .6), k = p < .5 ? .6 + 1.3 * eo(p * 2) : 1.25 - .25 * eio((p - .5) * 2);  // pulse once: grow past, settle
      Object.assign(s.ring.style, { display: u >= .8 ? "block" : "none", left: cx - 42 + "px", top: cy - 42 + "px",
        transform: `scale(${k})`, opacity: p < .5 ? .5 + p : 1 });
    }
    for (const g of s.toggles) {
      const f = g.on ? 1 : g.flip ? eio(P(u, 1.0, .18)) : 0;
      g.r.querySelector(".tg").style.background = f >= .5 ? "var(--on)" : "var(--off)";
      g.r.querySelector(".tg i").style.transform = `translateX(${f * 36}px)`;
    }
  });
};
window.render(0);
</script>
</body></html>
